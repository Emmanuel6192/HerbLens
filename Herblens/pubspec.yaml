name: herb_identifier
description: AI-powered herb identification app using TFLite
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Camera & Image
  camera: ^0.10.5+9
  image_picker: ^1.0.7
  image: ^4.1.3
  image_cropper: ^11.0.0

  # TFLite Inference
  tflite_flutter: ^0.12.1


  # Permissions
  permission_handler: ^11.3.1

  # UI & Utils
  cupertino_icons: ^1.0.2
  google_fonts: ^6.2.1
  path_provider: ^2.1.2
  path: ^1.9.0
  flutter_animate: ^4.5.0
  percent_indicator: ^4.2.3
  lottie: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/herb_model.tflite
    - assets/labels.txt
    - assets/plants.json
